screened_label: archon:auto-approved
approved_label: archon:approved
screened_branches:
- archon/*
screened_authors: []
deny_paths:
- .github/*
- Dockerfile*
- .dockerignore
- docker-compose*
- .railway/*
- railway.*
- fly.toml
- vercel.json
- wrangler.toml
- wrangler.json
- wrangler.jsonc
- Procfile
- ops/*
- scripts/deploy*
- .env*
- build.rs
- .cargo/*
- Makefile
- justfile
- .npmrc
- .husky/*
- '*.gradle'
- '*.gradle.kts'
- gradle.properties
- gradlew*
- CLAUDE.md
- AGENTS.md
- .claude/*
- .archon/*
- makefile
- GNUmakefile
- dockerfile
- CLAUDE.local.md
- .mcp.json
extra_deny_paths:
- public/_headers
- public/_redirects
- public/_routes.json
- functions/*
- _worker.js
- '*/_worker.js/*'
- tests/browser.mjs
- tests/serve.mjs
- requirements/*
sensitive_path_words:
- auth
- token
- secret
- credential
- session
- security
- crypto
- permission
sensitive_path_exempt:
- '*fixtures/*'
- '*snapshots/*'
- '*.snap'
- '*.md'
code_patterns:
  js: &id001
  - \bchild_process\b
  - \bprocess\.env\b
  - \bimport\.meta\.env\b
  - \bBun\.(spawn|spawnSync|env)\b
  - \bBun\.\$
  - import\s*\{[^}]*\$[^}]*\}\s*from\s*['"]bun['"]
  - \bDeno\.(run|Command|env)\b
  - (require\s*\(\s*|from\s+|import\s*\(\s*)['"](node:)?(net|dgram|tls|cluster|worker_threads)['"]
  - \b(execa|shelljs)\b
  - \bfetch\s*\(
  - \b(XMLHttpRequest|WebSocket|EventSource|sendBeacon)\b
  - (require\s*\(\s*|from\s+|import\s*\(\s*)[\'\"](node:)?(fs|fs/promises|http|https|http2|os|vm|child_process|readline)[\'"]
  - \bprocess\s*\[
  - \{[^}]*\benv\b[^}]*\}\s*=\s*process
  - (require|import)\s*\(\s*[^)]*[\'\"]\s*\+
  - \blocation\s*(\.\s*(href|assign|replace)\b|\[)
  - \bwindow\.open\s*\(
  - \bdocument\.write
  mjs: *id001
  cjs: *id001
  jsx: *id001
  ts: *id001
  mts: *id001
  cts: *id001
  tsx: *id001
  sh: &id002
  - .
  bash: *id002
  html:
  - http-equiv\s*=\s*[\'"]?\s*refresh
  - <script[^>]+src\s*=\s*[\'\"]\s*(https?:)?//
migrations:
  paths:
  - '*.sql'
  - '*/migrations/*'
  - migrations/*
  - '*/alembic/*'
  app_schemas: []
  foreign_schemas:
  - public
  - auth
  - storage
  - extensions
  - pg_catalog
  - information_schema
  - vault
  - realtime
  - supabase_functions
  - cron
  - net
  - pgsodium
  - graphql
  - pg_temp
  deny_sql:
  - \bGRANT\b
  - \bREVOKE\b
  - \b(CREATE|ALTER|DROP)\s+(ROLE|USER|GROUP|EXTENSION|SCHEMA|DATABASE|SERVER|FOREIGN|PUBLICATION|SUBSCRIPTION|EVENT\s+TRIGGER|LANGUAGE|POLICY|DEFAULT\s+PRIVILEGES)\b
  - \bOWNER\s+TO\b
  - \b(DROP|REASSIGN)\s+OWNED\b
  - \bROW\s+LEVEL\s+SECURITY\b
  - \bSECURITY\s+DEFINER\b
  - \bSET\s+(LOCAL\s+|SESSION\s+)?(ROLE|SESSION\s+AUTHORIZATION|search_path)\b
  - \bsearch_path\b
  - \bEXECUTE\b
  - \bCOPY\b
  - \b(pg_read_file|pg_read_binary_file|pg_ls_dir|lo_import|lo_export|dblink\w*|pg_execute_server_program)\b
  - \bALTER\s+SYSTEM\b
