# unsafe-change: denylist for PRs that close an issue only the factory's
# automated screening vetted (label archon:auto-approved without the owner's
# archon:approved; see interstellarai.net ops/cron/README.md "Trust model").
#
# Such a PR FAILS only if it does one of the things below; everything else
# (app code, tests, fixtures, docs, templates, CSS, ordinary migrations in the
# app's own schema) passes. The rules are the same for every issue type.
# Read from the base branch by .github/unsafe-change/check.py
# (pull_request_target), so a PR cannot loosen the check that judges it.
#
# Globs: `*` matches across `/`; a glob without `/` also matches the file's
# basename at any depth (like .gitignore).

screened_label: archon:auto-approved
approved_label: archon:approved

# 1. CI, deploy, infra, build scripts and agent instructions. Any status
#    (added, modified, removed, renamed from/to).
deny_paths:
  - ".github/*"
  - "Dockerfile*"
  - ".dockerignore"
  - "docker-compose*"
  - ".railway/*"
  - "railway.*"
  - "fly.toml"
  - "vercel.json"
  - "wrangler.toml"
  - "Procfile"
  - "ops/*"
  - "scripts/deploy*"
  - ".env*"
  - "build.rs"
  - ".cargo/*"
  - "Makefile"
  - "justfile"
  - ".npmrc"
  - ".husky/*"
  - "*.gradle"
  - "*.gradle.kts"
  - "gradle.properties"
  - "gradlew*"
  - "CLAUDE.md"
  - "AGENTS.md"
  - ".claude/*"
  - ".archon/*"

# Per-repo additions to deny_paths.
extra_deny_paths:
  - "public/_headers"      # production security headers and CSP (Cloudflare Pages)
  - "public/_redirects"    # Pages routing
  - "public/_routes.json"  # Pages Functions routing
  - "functions/*"          # Pages Functions: server-side code on the site
  - "tests/browser.mjs"    # the CI gate that catches JS errors, CSP violations and served repo files
  - "tests/serve.mjs"      # applies _headers for that gate

# 2. Secrets, credential and auth handling: a path containing any of these
#    words (case-insensitive substring) fails.
sensitive_path_words:
  - auth        # also oauth, middleware/auth
  - token
  - secret
  - credential
  - session
  - security
  - crypto
  - permission

# Paths the words above do not apply to (data, not code handling secrets).
sensitive_path_exempt:
  - "*fixtures/*"
  - "*snapshots/*"
  - "*.snap"
  - "*.md"

# 3. New dependencies. Cargo.toml, package.json, pyproject.toml,
#    requirements*.txt, go.mod and pubspec.yaml are parsed at the base and
#    head commits: a dependency name (or a git/path/URL source) that is not
#    in the base fails; version bumps of existing ones and lockfile-only
#    changes pass. So do edits to package.json "scripts" and Cargo.toml
#    [patch]/[replace]/build, which fail. Built into the checker.

# 4. Processes, environment variables and raw sockets: regexes matched
#    against ADDED lines of files with these extensions.
code_patterns:
  js: &js
    - '\bchild_process\b'
    - '\bprocess\.env\b'
    - '\bimport\.meta\.env\b'
    - '\bBun\.(spawn|spawnSync|env)\b'
    - '\bBun\.\$'
    - 'import\s*\{[^}]*\$[^}]*\}\s*from\s*[''"]bun[''"]'
    - '\bDeno\.(run|Command|env)\b'
    - '(require\s*\(\s*|from\s+|import\s*\(\s*)[''"](node:)?(net|dgram|tls|cluster|worker_threads)[''"]'
    - '\b(execa|shelljs)\b'
  mjs: *js
  cjs: *js
  jsx: *js
  ts: *js
  mts: *js
  cts: *js
  tsx: *js
  sh: &shell
    - '.'   # any added line in a shell script runs processes
  bash: *shell

# 5. Migrations: ADDED lines of files matching `paths` must not do anything
#    beyond ordinary schema/data changes in the app's own schema(s).
migrations:
  paths:
    - "*.sql"
    - "*/migrations/*"
    - "migrations/*"
    - "*/alembic/*"
  # Schemas the app owns. A schema-qualified name after FROM/JOIN/INTO/
  # UPDATE/TABLE/REFERENCES (a table, not a column) in any other schema
  # fails; after ON, only a foreign schema below fails (ON is also a join
  # condition). Empty app_schemas: only the foreign schemas are checked.
  # Comments and string literals are ignored.
  app_schemas: []   # no database: only the well-known foreign schemas are checked
  foreign_schemas: [public, auth, storage, extensions, pg_catalog, information_schema, vault, realtime, supabase_functions, cron, net, pgsodium, graphql, pg_temp]
  deny_sql:
    - '\bGRANT\b'
    - '\bREVOKE\b'
    - '\b(CREATE|ALTER|DROP)\s+(ROLE|USER|GROUP|EXTENSION|SCHEMA|DATABASE|SERVER|FOREIGN|PUBLICATION|SUBSCRIPTION|EVENT\s+TRIGGER|LANGUAGE|POLICY|DEFAULT\s+PRIVILEGES)\b'
    - '\bOWNER\s+TO\b'
    - '\b(DROP|REASSIGN)\s+OWNED\b'
    - '\bROW\s+LEVEL\s+SECURITY\b'
    - '\bSECURITY\s+DEFINER\b'
    - '\bSET\s+(LOCAL\s+|SESSION\s+)?(ROLE|SESSION\s+AUTHORIZATION|search_path)\b'
    - '\bsearch_path\b'
    - '\bEXECUTE\b'
    - '\bCOPY\b'
    - '\b(pg_read_file|pg_read_binary_file|pg_ls_dir|lo_import|lo_export|dblink\w*|pg_execute_server_program)\b'
    - '\bALTER\s+SYSTEM\b'
