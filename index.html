<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catscape: Lyra's great escape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e1f0; --fg:#2b2238; --muted:#6f6480; --frame:#2b2238;
  --btn:#d6cbe3; --btn-on:#bfb0d3; --accent:#f0a040; --accent-ink:#2a1606;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140f1f; --fg:#f1e7da; --muted:#8c80a3; --frame:#3a2f52;
    --btn:#2a2140; --btn-on:#43376a;
  }
}
:root[data-theme="dark"]{
  --bg:#140f1f; --fg:#f1e7da; --muted:#8c80a3; --frame:#3a2f52;
  --btn:#2a2140; --btn-on:#43376a;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--fg);
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overflow:hidden;
}
#app{height:100%;display:flex;flex-direction:column;max-width:1600px;margin:0 auto;padding:6px 8px;box-sizing:border-box;gap:6px;background:var(--bg)}
#topbar{display:flex;justify-content:space-between;align-items:center}
#topbar h1{font-size:12px;margin:0;letter-spacing:1px;color:var(--accent)}
#topbar .tools{display:flex;gap:8px}
#topbar button{font:inherit;font-size:10px;background:var(--btn);color:var(--fg);border:none;border-radius:8px;padding:8px 10px;cursor:pointer}
#topbar button:focus-visible,#pad button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{
  image-rendering:pixelated;image-rendering:crisp-edges;background:#000;
  border-radius:4px;box-shadow:0 0 0 4px var(--frame);touch-action:none;display:block;
}
#keys{font-size:9px;color:var(--muted);text-align:center;line-height:2;margin:0}
#pad{display:none;justify-content:space-between;align-items:center;padding:0 2px 6px;gap:12px}
@media (pointer:coarse){#pad{display:flex}#keys{display:none}}
.grp{display:flex;gap:10px;align-items:center}
#pad button{
  width:62px;height:62px;border-radius:14px;border:none;background:var(--btn);color:var(--fg);
  font:inherit;font-size:16px;touch-action:none;-webkit-tap-highlight-color:transparent;
}
#pad button.act{border-radius:50%;font-size:9px}
#pad button.big{width:76px;height:76px;background:var(--accent);color:var(--accent-ink)}
#pad button.on{background:var(--btn-on)}
#pad button.big.on{filter:brightness(.8)}
@media (pointer:coarse) and (orientation:landscape){
  #app{padding:4px 6px;gap:4px}
  #topbar h1{font-size:10px}
  #topbar button{padding:6px 8px;font-size:9px}
  #pad{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:0 calc(env(safe-area-inset-left,0px) + 10px) 0 calc(env(safe-area-inset-right,0px) + 10px);pointer-events:none}
  #pad .grp{pointer-events:auto;opacity:.55}
  #pad .grp:first-child{flex-direction:column-reverse}
  #pad .grp:first-child{display:grid;grid-template-columns:repeat(2,58px);gap:8px}
  #pad button{width:58px;height:58px}
  #pad button.big{width:70px;height:70px}
}
</style>
</head>
<body>
<main id="app">
  <div id="topbar">
    <h1>Catscape</h1>
    <div class="tools">
      <button id="btnHint" aria-label="What is Lyra thinking?">Hint</button>
      <button id="btnFull" aria-label="Full screen" hidden>Full screen</button>
      <button id="btnRestart" aria-label="Restart this room">Restart</button>
      <button id="btnMute" aria-label="Toggle sound">Sound on</button>
    </div>
  </div>
  <div id="stage"><canvas id="game" aria-label="Catscape game screen"></canvas></div>
  <p id="keys">Arrows or WASD to move &nbsp; Up / Space to jump, climb and use doorways &nbsp; X to swat &nbsp; Down to drop or meow &nbsp; H for a hint &nbsp; R to restart</p>
  <div id="pad">
    <div class="grp">
      <button data-k="left" aria-label="Left">◀</button>
      <button data-k="down" aria-label="Down">▼</button>
      <button data-k="right" aria-label="Right">▶</button>
    </div>
    <div class="grp">
      <button data-k="paw" class="act" aria-label="Swat">SWAT</button>
      <button data-k="jump" class="act big" aria-label="Jump">JUMP</button>
    </div>
  </div>
</main>

ctx.imageSmoothingEnabled = false;
let S = 2;
const textQ = [];
const GRAV = 0.25, JUMPV = -3.35, RUN = 1.4, MAXF = 5;

/* ---------- House ----------
 Each room is one screen (20x12 tiles). Rooms sit on a grid (gx, gy):

 x plate→red gate X   y plate→blue gate Y   k light switch→yellow gate K   W study window

const roomAt = (gx, gy) => ROOM_IDS.find(id => ROOMS[id].gx === gx && ROOMS[id].gy === gy);

function hintFor(id){
  switch (id) {
    case 'bathroom':
      if (gateOpen.Y) return "Clunk! Da blue plate iz down. Sumwhere, a blue gate iz open now.";
      return "Da bath iz full of WATER. *shudder* Dat blue plate over dere... and dat laundry basket could be a stepping stone.";
    case 'bedroom':
      if (birdState === 'perched') return "BIRB. Dere iz a birb. (Move left or right to go.)";
      return "Da big window iz in da study, where hooman sits. Study iz to da right, past da landing. (JUMP at tall furniture to grab the edge, JUMP again to climb.)";
    case 'landing':
      if (gateOpen.K) return "Da gate iz open! Study iz RIGHT DERE.";
      if (world.living.visited) return "Dat yellow light on da gate... same as da light switch in da living room. Hmmmm.";
      return "Da stairs go down. (Stand in the doorway and press JUMP.) Dis dumb gate haz a little yellow light on it.";
    case 'hall': return "Kitchen dat way, living room dis way. If I get stuck on da left, da box can be mah stairs.";
    case 'kitchen':
      if (hasZoomies) return "Catnip: got. Zoomies: ACTIVATED. Dere was a light switch waaay up high somewhere...";
      if (gateOpen.X) return "Gate iz open. Da amazing smell iz in dere.";
      if (seen.has('plateX')) return "Gate opens when sumthin heavy sits on da red plates. What iz heavy... and knockable... (Careful: dat hob gets HOT.)";
      return "Sumthin smells AMAZING behind dat red gate. Dem red plates look sus. (Careful: dat hob gets HOT.)";
    case 'living':
      if (gateOpen.K) return "Switch iz flipped. Clunk upstairs! And dere's a gap way up on da right... hooman's office?";
      if (hasZoomies) return "From da end of da sofa: jump, den JUMP again in da air to grab da tall cabinet. Den bap da switch. Avoid da Roomba.";
      return "Dat switch iz waaay too high. I need da zoomies. And I am NOT touching da Roomba.";
    case 'office':
      if (!gateOpen.Y) return "A blue gate. Blue like... dat plate in da bathroom, next to mah bedroom.";
      if (heatingOn) return "Heating iz ON. Now to da study: dat radiator valve!";
      return "Da THERMOSTAT iz on da wall, up top. Climb da cabinet and bookcase. Watch da wires and da cactus. Da fan can be bapped off.";
    case 'study':
      if (netDown) return "Da net iz down. Up on da window seat and OUT! (Zoomies help.)";
      if (windowOpen) return "Hooman opened da window! But dere's a mosquito net. Bap it until it falls!";
      if (valveOpen && heatingOn) return "Radiator iz toasty. Now wait for hooman to get sweaty...";
      if (valveOpen) return "Valve iz open but da radiator iz cold. Da heating iz off. Hooman keeps da thermostat in da office.";
      return "Hooman opens da window when it gets hot in here. Dat radiator by da door haz a valve...";

}

/* ---------- World ---------- */
let state = 'title', world, cur, grid, player, objs, roombas, fishes, plates, levers, feeders, kibbles, fans;
let gateOpen = { X:false, Y:false, K:false }, gateAnim = { X:0, Y:0, K:0 };
let leverOn = false, hasZoomies = false;
let fishTotal = 0, fishGot = 0, deaths = 0;
let frame = 0, cardT = 0, deadT = 0, exitT = 0, winT = 0, fadeT = 0;
let thoughts = [], seen = new Set(), birdState = 'gone', birdT = 0;
let heatingOn = false, valveOpen = false, heat = 0, windowOpen = false, winAnim = 0, netHits = 0, netDown = false, netFall = 0, netShake = 0;
let deathMsg = '', winCatY = 118;
let particles = [];

fishTotal = ROOM_IDS.reduce((n, id) => n + ROOMS[id].map.join('').split('f').length - 1, 0);

function newPlayer(){
  return { x:0, y:0, w:12, h:10, vx:0, vy:0, facing:1, ground:true, state:'normal',
           coyote:0, jumpBuf:0, grabCD:0, pawT:0, dropT:0, ct:0, meowT:0, pushing:false, dbl:false,
           cx0:0, cy0:0, cx1:0, cy1:0 };
}

function parseRoom(id){
  const def = ROOMS[id];
  const r = { id, def, grid:[], objs:[], roombas:[], fishes:[], plates:[], levers:[], doors:[], items:[], feeders:[], kibbles:[], fans:[], human:null, visited:false, start:null, entry:null };
  def.map.forEach((row, ty) => {
    r.grid[ty] = [];
    [...row].forEach((c, tx) => {
      let t = c;
      if (c === 'P') { r.start = { x:tx*T+2, y:ty*T+6 }; t = '.'; }
      else if (c === 'o') { r.objs.push({ type:'box', x:tx*T+1, y:ty*T+2, w:14, h:14, vx:0, vy:0, ground:true }); t = '.'; }
      else if (c === 'v') { r.objs.push({ type:'vase', x:tx*T+4, y:ty*T+5, w:8, h:11, vx:0, vy:0, ground:true }); t = '.'; }
      else if (c === 'r') { r.roombas.push({ x:tx*T, y:ty*T+9, w:16, h:7, vx:-0.6 }); t = '.'; }
      else if (c === 'f') { r.fishes.push({ x:tx*T+3, y:ty*T+6, w:10, h:5, got:false }); t = '.'; }
      else if (c === 'n') { r.items.push({ kind:'catnip', x:tx*T+5, y:ty*T+9, w:6, h:7, got:false }); t = '.'; }
      else if (c === 'x' || c === 'y') r.plates.push({ tx, ty, g:c.toUpperCase(), down:false });
      else if (c === 'k') r.levers.push({ tx, ty });
      else if (c >= '1' && c <= '9') r.doors.push({ tx, ty, d:c });
      else if (c === 'M') r.feeders.push({ tx, ty, hits:0, shake:0, cool:0 });
      else if (c === 'g') r.fans.push({ tx, ty, on:true, dir:-1 });
      else if (c === 'm') { r.human = { sx:tx*T + 8, x:tx*T + 8, tx:14*T + 4, state:'sit', t:0 }; t = '.'; }
      r.grid[ty][tx] = t;
    });
  });
  return r;
}

function bindRoom(){
  grid = cur.grid; objs = cur.objs; roombas = cur.roombas; fishes = cur.fishes;
  plates = cur.plates; levers = cur.levers; feeders = cur.feeders; kibbles = cur.kibbles; fans = cur.fans;
}

function enterRoom(id, px, py, facing){
  cur = world[id]; bindRoom();
  const p = player;
  p.x = px; p.y = py; p.facing = facing; p.state = 'normal'; p.vy = Math.min(p.vy, 0);
  p.jumpBuf = 0; p.dbl = false; p.grabCD = 0;
  cur.entry = { x:px, y:py, facing };
  particles = []; fadeT = 16;
  updatePlates(true);
  for (const g in gateAnim) gateAnim[g] = gateOpen[g] ? 1 : 0;
  const first = !cur.visited; cur.visited = true;
  roomThought(id, first);
}

function resetRoom(){
  const fresh = parseRoom(cur.id);
  cur.objs = fresh.objs; cur.roombas = fresh.roombas;
  bindRoom();
  const e = cur.entry;
  Object.assign(player, { x:e.x, y:e.y, facing:e.facing, vx:0, vy:0, state:'normal', dbl:false });
  updatePlates(true);
}

function newGame(){
  world = {};
  for (const id of ROOM_IDS) world[id] = parseRoom(id);
  gateOpen = { X:false, Y:false, K:false }; leverOn = false; hasZoomies = false;
  heatingOn = false; valveOpen = false; heat = 0; windowOpen = false; winAnim = 0; netHits = 0; netDown = false; netFall = 0; netShake = 0;
  fishGot = 0; deaths = 0; thoughts = []; seen = new Set();
  player = newPlayer();
  const s = world.bedroom.start;
  state = 'play'; birdState = 'perched'; birdT = 0;
  enterRoom('bedroom', s.x, s.y, 1);
  fadeT = 30;
  think("BIRB. Dere iz a birb. I must haz dat birb.", 260);
  think("(Move left or right to go get it.)", 400);
}

/* ---------- Lyra's thoughts ---------- */
function think(txt, dur){
  if (thoughts.some(t => t.text === txt)) return;
  thoughts.push({ text:txt, t:0, dur: dur || Math.max(200, txt.length * 4.5) });
  if (thoughts.length > 3) thoughts.splice(1, 1);
}
function thinkOnce(key, txt, dur){ if (seen.has(key)) return; seen.add(key); think(txt, dur); }
function thinkNow(txt, dur){ thoughts = []; think(txt, dur); }
function showHint(){ if (state === 'play' || state === 'dead') thinkNow(hintFor(cur.id)); }
function roomThought(id, first){
  if (id === 'landing') {
    if (gateOpen.K) thinkOnce('landingOpen', "Da gate iz open! Study iz RIGHT DERE.");
    else if (first) think("Da landing. Study iz past dat baby gate... which iz closed. HOOMANS.");
  } else if (id === 'hall' && first) think("Downstairs. Kitchen dat way, living room dis way.");
  else if (id === 'kitchen') {
    if (first) think("Sniff sniff. Sumthin smells AMAZING behind dat red gate.");
  } else if (id === 'living') {
    if (hasZoomies) thinkOnce('livingZ', "Now, wif dese zoomies... dat switch iz MINE.");
    else if (first) think("Da Roomba. Mah ancient nemesis. And a light switch, waaay up high.");
  } else if (id === 'study' && first) think("Hooman iz on da couch. Da big window iz closed. Hmm. How do I make hooman open it...");
  else if (id === 'bathroom' && first) think("Da bathroom. Da bath iz full of WATER. *shudder*");
  else if (id === 'office') {
    if (!gateOpen.Y) thinkOnce('officeGate', "Hooman's office! ...behind a blue gate. Blue like dat plate in da bathroom.");
    else thinkOnce('officeIn', "Hooman's office. Wires, a cactus, a fan... and da THERMOSTAT, up on da wall.");
  }
}

/* ---------- Sprites ---------- */

const GATE_COL = { X:'#ff6b6b', Y:'#6bd0ff', K:'#ffd35a' };

function drawSprite(spr, pal, x, y, flip=false, s=1, override) {
  const w = spr[0].length;
  for (let r = 0; r < spr.length; r++) {
    const row = spr[r];
    for (let c = 0; c < w; c++) {
      let ch = row[flip ? w-1-c : c];
      if (ch === '.') continue;
      if (override && override[ch]) ch = override[ch];
      ctx.fillStyle = pal[ch] || ch;
      ctx.fillRect(Math.round(x) + c*s, Math.round(y) + r*s, s, s);
    }
  }
}

/* ---------- Audio ---------- */
let AC = null, muted = false;
function audioInit(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type='square', vol=0.05, delay=0){
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function meow(){
  if (!AC || muted) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth';
  const base = 480 + Math.random()*120;
  o.frequency.setValueAtTime(base, t);
  o.frequency.linearRampToValueAtTime(base*1.6, t+0.12);
  o.frequency.linearRampToValueAtTime(base*0.9, t+0.45);
  f.type = 'bandpass'; f.Q.value = 3;
  f.frequency.setValueAtTime(900, t);
  f.frequency.linearRampToValueAtTime(1900, t+0.15);
  f.frequency.linearRampToValueAtTime(700, t+0.45);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.14, t+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
  o.connect(f).connect(g).connect(AC.destination);
  o.start(t); o.stop(t+0.55);
}

/* ---------- Collision helpers ---------- */
const isGate = c => c === 'X' || c === 'Y' || c === 'K';
const SOLID = new Set(['#','B','S','C','L','F','U','H','A']);
const isPlat = c => c === '=' || c === 't';
function tile(tx, ty){
  if (ty < 0 || ty >= grid.length) return '#';
  if (tx < 0) return grid[ty][0] === '.' ? '.' : '#';
  if (tx >= grid[0].length) return grid[ty][grid[0].length-1] === '.' ? '.' : '#';
  return grid[ty][tx];
}
function solidAt(tx, ty){
  const c = tile(tx, ty);
  return SOLID.has(c) || (isGate(c) && !gateOpen[c]);
}
function hitSolid(x, y, w, h){
  for (let ty = Math.floor(y/T); ty <= Math.floor((y+h-0.001)/T); ty++)
    for (let tx = Math.floor(x/T); tx <= Math.floor((x+w-0.001)/T); tx++)
      if (solidAt(tx, ty)) return true;
  return false;
}
function rectOv(x, y, w, h, o){ return x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y; }
function shelfLand(x, w, oldFeet, newFeet){
  const ty = Math.floor(newFeet / T), top = ty * T;
  if (oldFeet <= top + 0.001 && newFeet > top) {
    for (let tx = Math.floor(x/T); tx <= Math.floor((x+w-0.001)/T); tx++)
      if (isPlat(tile(tx, ty))) return top;
  }
  return null;
}
function onShelf(e){
  const feet = e.y + e.h, ty = Math.round(feet / T);
  if (Math.abs(feet - ty*T) > 0.01) return false;
  for (let tx = Math.floor(e.x/T); tx <= Math.floor((e.x+e.w-0.001)/T); tx++)
    if (isPlat(tile(tx, ty))) return true;
  return false;
}
function boxUnder(e){
  return objs.some(o => o.type === 'box' && o !== e && Math.abs(e.y + e.h - o.y) < 0.6 && e.x < o.x + o.w && e.x + e.w > o.x);
}
function grounded(e){
  if (hitSolid(e.x, e.y + 0.5, e.w, e.h)) return true;
  if (onShelf(e) && !(e === player && player.dropT > 0)) return true;
  if (e === player) return boxUnder(e);
  return false;
}

function moveBodyY(e, dy, opts = {}){
  const s = Math.sign(dy); let rem = Math.abs(dy);
  while (rem > 0) {
    const st = Math.min(1, rem) * s, ny = e.y + st;
    if (hitSolid(e.x, ny, e.w, e.h)) {
      if (s > 0) { e.y = Math.floor((ny + e.h) / T) * T - e.h; e.ground = true; }
      else e.y = (Math.floor(ny / T) + 1) * T;
      e.vy = 0; return;
    }
    if (s > 0 && !opts.drop) {
      const sy = shelfLand(e.x, e.w, e.y + e.h, ny + e.h);
      if (sy !== null) { e.y = sy - e.h; e.vy = 0; e.ground = true; return; }
    }
    if (opts.boxes) {
      for (const o of objs) {
        if (o.type === 'box' && rectOv(e.x, ny, e.w, e.h, o)) {
          if (s > 0) { e.y = o.y - e.h; e.ground = true; } else e.y = o.y + o.h;
          e.vy = 0; return;
        }
      }
    }
    e.y = ny; rem -= Math.abs(st);
  }
}

function movePlayerX(dx){
  const p = player, s = Math.sign(dx); let rem = Math.abs(dx);
  p.pushing = false;
  while (rem > 0) {
    const st = Math.min(1, rem) * s, nx = p.x + st;
    if (hitSolid(nx, p.y, p.w, p.h)) {
      p.x = s > 0 ? Math.floor((nx + p.w) / T) * T - p.w : (Math.floor(nx / T) + 1) * T;
      p.vx = 0; break;
    }
    const b = objs.find(o => o.type === 'box' && rectOv(nx, p.y, p.w, p.h, o));
    if (b) {
      const canPush = p.ground && b.ground && !hitSolid(b.x + st, b.y, b.w, b.h)
        && !roombas.some(r => rectOv(b.x + st, b.y, b.w, b.h, r));
      if (canPush) { b.x += st; p.pushing = true; b.pushDir = s; b.pushT = 4; }
      else { p.x = s > 0 ? b.x - p.w : b.x + b.w; p.vx = 0; break; }
    }
    p.x = nx; rem -= Math.abs(st);
  }
}

function moveObjX(o, dx){
  const s = Math.sign(dx); let rem = Math.abs(dx);
  while (rem > 0) {
    const st = Math.min(1, rem) * s, nx = o.x + st;
    if (hitSolid(nx, o.y, o.w, o.h)) { o.vx *= -0.3; return; }
    o.x = nx; rem -= Math.abs(st);
  }
}

/* ---------- Particles ---------- */
function puff(x, y, n, col, spread = 1){
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx:(Math.random()-.5)*2*spread, vy:-Math.random()*1.5*spread, life:20+Math.random()*20, col });
}

/* ---------- Game logic ---------- */
function tryGrab(){
  const p = player, f = p.facing;
  if (!hitSolid(p.x + f, p.y, p.w, p.h)) return;
  const tx = Math.floor((f > 0 ? p.x + p.w + 0.5 : p.x - 0.5) / T);
  const rows = new Set([Math.floor((p.y - 6) / T), Math.floor((p.y + 7) / T)]);
  for (const ty of rows) {
    const ly = ty * T;
    // bookcases are cat ladders: every shelf is something to hang on
    const shelf = tile(tx, ty) === 'C' && tile(tx, ty - 1) === 'C';
    if (!shelf && (!solidAt(tx, ty) || solidAt(tx, ty - 1))) continue;
    if (p.y < ly - 6 || p.y > ly + 7) continue;
    if (hitSolid(p.x, ly - 3, p.w, p.h)) continue;
    if (!shelf) {
      const cx = f > 0 ? tx*T + 1 : tx*T + T - p.w - 1, cy = ly - p.h;
      if (hitSolid(cx, cy, p.w, p.h)) continue;
      p.cx1 = cx; p.cy1 = cy;
    }
    p.state = 'hang'; p.mid = shelf; p.htx = tx; p.hly = ly;
    p.y = ly - 3; p.vx = p.vy = 0; p.dbl = false;
    if (shelf) thinkOnce('cling', "Bookcases iz basically cat ladders. (Keep pressing JUMP to climb.)", 220);
    SFX.grab(); return;
  }
}

function pawRect(){
  const p = player;
  return p.facing > 0 ? { x:p.x + p.w - 4, y:p.y - 4, w:12, h:p.h + 6 } : { x:p.x - 8, y:p.y - 4, w:12, h:p.h + 6 };
}

function doPaw(){
  const r = pawRect(); let hit = false;
  for (const o of objs) {
    if (o.type === 'vase' && rectOv(r.x, r.y, r.w, r.h, o)) {
      o.vx = player.facing * 2.6; o.vy = -1.3; o.ground = false;
      SFX.knock(); hit = true;
      thinkOnce('vase', "Oopsie. Not sorry.", 150);
    }
  }
  for (const lv of levers) {
    if (rectOv(r.x, r.y, r.w, r.h, { x:lv.tx*T+4, y:lv.ty*T+2, w:8, h:12 })) {
      leverOn = !leverOn; SFX.click(); hit = true;
      puff(lv.tx*T+8, lv.ty*T+6, 5, '#ffd35a', .6);
      thinkNow(leverOn ? "Click! Sumthin went clunk upstairs." : "Click. Sumthin clunked upstairs again.");
    }
  }
  for (const fd of feeders) {
    if (rectOv(r.x, r.y, r.w, r.h, { x:fd.tx*T+2, y:fd.ty*T, w:12, h:16 })) {
      hit = true; fd.shake = 12;
      if (fd.cool > 0) { SFX.error(); thinkOnce('feederEmpty', "It iz sulking. Maybe later.", 150); continue; }
      fd.hits++; SFX.thunk();
      if (fd.hits >= 3) {
        fd.hits = 0; fd.cool = 600; SFX.dispense();
        for (let i = 0; i < 3; i++)
          kibbles.push({ x:fd.tx*T + 7, y:fd.ty*T + 8, w:3, h:3, vx:0.4 + Math.random() * 1.8, vy:-2 - Math.random() * 1.5, ground:false });
        thinkNow("KIBBLE! Every piece iz worth a life. Dat iz science.");
      } else if (fd.hits === 1) thinkOnce('feederHit', "It rattled. Keep bapping.", 150);
    }
  }
  const tilesIn = ch => { const out = []; for (let ty = 0; ty < grid.length; ty++) for (let tx = 0; tx < grid[0].length; tx++) if (grid[ty][tx] === ch) out.push([tx, ty]); return out; };
  for (const [tx, ty] of tilesIn('Z')) {
    if (rectOv(r.x, r.y, r.w, r.h, { x:tx*T+3, y:ty*T+2, w:10, h:12 })) {
      hit = true; heatingOn = !heatingOn; SFX.click();
      puff(tx*T+8, ty*T+8, 6, '#ffb040', .6);
      thinkNow(heatingOn ? "Heating: ON. Hooman hates it when I do dat. Heh." : "Heating: off again. Hmm, maybe not.");
    }
  }
  for (const [tx, ty] of tilesIn('R')) {
    if (rectOv(r.x, r.y, r.w, r.h, { x:tx*T+22, y:ty*T+14, w:12, h:14 })) {
      hit = true; valveOpen = !valveOpen; SFX.click();
      if (!valveOpen) thinkNow("Valve closed. Radiator going cold.");
      else if (heatingOn) thinkNow("Tssssss. Da radiator iz heating up. Hooman iz gonna get TOASTY.");
      else thinkNow("Valve iz open... but da radiator iz still cold. Da heating must be off. Hooman keeps da thermostat in da office.");
    }
  }
  for (const fan of fans) {
    if (rectOv(r.x, r.y, r.w, r.h, { x:fan.tx*T+1, y:fan.ty*T, w:14, h:16 })) {
      hit = true; fan.on = !fan.on; SFX.click();
      if (!fan.on) thinkOnce('fanOff', "Bap. Fan iz off. Who's blowing who away now?", 180);
    }
  }
  for (const [tx, ty] of tilesIn('W')) {
    if (rectOv(r.x, r.y, r.w, r.h, { x:tx*T-6, y:ty*T-10, w:28, h:26 })) {
      hit = true;
      if (!windowOpen) { SFX.tink(); thinkOnce('glass', "Glass. Can't bap through glass. Hooman has to open it.", 200); }
      else if (!netDown) {
        netHits++; netShake = 12; SFX.thunk();
        if (netHits >= 5) { netDown = true; netFall = 1; SFX.dispense(); thinkNow("DA NET IZ DOWN! Freedom iz RIGHT DERE!"); }
        else if (netHits === 1) thinkNow("Bap.", 90);
        else if (netHits === 3) thinkNow("It's loosening! Bap bap bap!", 120);
      }
    }
  }
  const hm = cur.human;
  if (hm && rectOv(r.x, r.y, r.w, r.h, { x:hm.x - 8, y:130, w:16, h:46 })) {
    hit = true; SFX.thunk(); thinkOnce('bapHooman', "Bapped da hooman. Hooman said 'ow'. No regrets.", 200);
  }
  if (!hit) SFX.swipe();
}

function gateBlocked(g){
  const bodies = [player, ...objs, ...roombas];
  for (let ty = 0; ty < grid.length; ty++)
    for (let tx = 0; tx < grid[0].length; tx++)
      if (grid[ty][tx] === g && bodies.some(b => rectOv(tx*T, ty*T, T, T, b))) return true;
  return false;
}
function setGate(g, open, silent){
  if (open === gateOpen[g]) return;
  if (!open && gateBlocked(g)) return;
  gateOpen[g] = open;
  if (!silent && grid.some(row => row.includes(g))) SFX.gate();
}
function updatePlates(silent){
  const want = {};
  for (const pl of plates) {
    const top = (pl.ty + 1) * T, was = pl.down;
    pl.down = [player, ...objs].some(b => Math.abs(b.y + b.h - top) < 1 && b.x < pl.tx*T + 15 && b.x + b.w > pl.tx*T + 1);
    if (pl.down && !was && !silent) {
      SFX.plate();
      const byPlayer = Math.abs(player.y + player.h - top) < 1 && player.x < pl.tx*T + 15 && player.x + player.w > pl.tx*T + 1;
      if (byPlayer && pl.g === 'X') thinkOnce('plateX', "Da gate opened when I stood here! ...and it closes when I get off. Needs sumthin heavy to sit on it.");
      if (byPlayer && pl.g === 'Y') thinkOnce('plateY', "A blue plate. Sumthin clunked... but it'll unclunk when I step off. Needs sumthin heavy.");
      if (!byPlayer && pl.g === 'Y') thinkOnce('plateObjY', "Clunk! Heavy fing on da blue plate. Sumwhere in dis house, a blue gate just opened.");
      else if (!byPlayer) thinkOnce('plateObj' + pl.g, "Heavy fings on plates keep da gates open. I iz genius.");
    }
    want[pl.g] = want[pl.g] || pl.down;
  }
  for (const g in want) setGate(g, want[g], silent);
  setGate('K', leverOn, silent);
}

const DEATH = {
  roomba: ["Roomba'd!", "Note to self: Roomba bad."],
  water:  ["SPLOOSH!", "WET. I iz WET. Worst. Day. Ever."],
  cactus: ["OUCH!", "Cactus. Pointy. Lesson learned."],
  zap:    ["ZAP!", "ZAPPED. Mah fur iz all fluffy now."],

};
function die(cause){
  if (state !== 'play') return;
  state = 'dead'; deadT = 80; deaths++;
  const d = DEATH[cause] || DEATH.roomba;
  deathMsg = d[0];
  cause === 'water' ? SFX.splash() : SFX.die();
  puff(player.x + 6, player.y + 5, 18, cause === 'water' ? '#8fd3ff' : cause === 'zap' ? '#fff27a' : '#f0a040', 1.4);
  thinkNow(!seen.has('die' + cause) ? d[1] : ["Ow. Undignified.", "Dat was anuvver life.", "Nine lives iz not dat many."][deaths % 3]);
  seen.add('die' + cause);
}

const sparkOn = () => frame % 160 < 60, sparkWarn = () => frame % 160 >= 135;
const hobOn = () => (frame + 50) % 220 < 100, hobWarn = () => (frame + 50) % 220 >= 185;
function hazardAt(p){
  const x0 = p.x + 2, y0 = p.y + 2, w = p.w - 4, h = p.h - 2;
  for (let ty = Math.floor(y0 / T); ty <= Math.floor((y0 + h) / T); ty++)
    for (let tx = Math.floor(x0 / T); tx <= Math.floor((x0 + w) / T); tx++) {
      const c = tile(tx, ty), x = tx*T, y = ty*T;
      let rr = null, cause = null;
      if (c === '~') { rr = { x, y:y+6, w:T, h:10 }; cause = 'water'; }
      else if (c === '*') { rr = { x:x+4, y:y+3, w:8, h:13 }; cause = 'cactus'; }
      else if (c === 'e' && sparkOn()) { rr = { x, y:y+10, w:T, h:6 }; cause = 'zap'; }
      else if (c === 'h' && hobOn()) { rr = { x:x+2, y:y+5, w:12, h:11 }; cause = 'hob'; }
      if (rr && rectOv(x0, y0, w, h, rr)) return cause;
    }
  return null;
}

function updateStudy(){
  if (valveOpen && heatingOn) heat = Math.min(900, heat + 1); else heat = Math.max(0, heat - 1);
  if (netShake > 0) netShake--;
  if (netFall > 0 && netFall < 60) netFall++;
  if (windowOpen && winAnim < 1) winAnim = Math.min(1, winAnim + 0.04);
  const h = cur.human;
  if (!h) return;
  h.t++;
  if (h.state === 'sit' && heat > 200 && !windowOpen) { h.state = 'hot'; thinkOnce('hot', "Hooman iz getting sweaty. Heh heh heh."); }
  else if (h.state === 'hot') {
    if (heat < 100) h.state = 'sit';
    else if (heat > 480) { h.state = 'walk'; SFX.sigh(); thinkNow("Hooman iz getting up... GO HOOMAN GO."); }
  } else if (h.state === 'walk') {
    h.x += 0.45;
    if (h.x >= h.tx) { h.x = h.tx; h.state = 'open'; h.t = 0; }
  } else if (h.state === 'open') {
    if (h.t === 35) { windowOpen = true; SFX.gate(); thinkNow("HOOMAN OPENED DA WINDOW! ...but dere iz a mosquito net. Must... bap... net."); }
    if (h.t > 75) h.state = 'back';
  } else if (h.state === 'back') {
    h.x -= 0.45;
    if (h.x <= h.sx) { h.x = h.sx; h.state = 'relax'; }
  }
}

function doorAt(p){
  const c = tile(Math.floor((p.x + p.w/2) / T), Math.floor((p.y + p.h/2) / T));
  return (c >= '1' && c <= '9') ? c : null;
}
function goDoor(d){
  for (const id of ROOM_IDS) {
    if (id === cur.id) continue;
    const dd = world[id].doors.find(o => o.d === d);
    if (dd) { SFX.door(); player.vx = 0; player.vy = 0; enterRoom(id, dd.tx*T + 2, dd.ty*T + 6, player.facing); return; }
  }
}

function updateBird(){
  if (birdState === 'perched') {
    birdT++;
    if (cur.id === 'bedroom' && birdT % 150 === 30) SFX.chirp();
    if (cur.id === 'bedroom' && birdT % 150 === 75) SFX.chatter();
    if (held.left || held.right || pressed.has('jump')) { birdState = 'flying'; birdT = 0; SFX.flap(); }
  } else if (birdState === 'flying') {
    if (++birdT > 70) {
      birdState = 'gone';
      thinkNow("NOOO. Birb flew away. RUDE.", 170);
      think("Da study haz da big window. Hooman sits in dere. If I get hooman to open it... birb iz MINE. Study iz to da right, past da landing.", 360);
      think("(JUMP at tall furniture to grab the edge, then JUMP again to climb.)", 330);
    }
  }
}

function updatePlay(){
  const p = player;
  if (pressed.has('restart')) { resetRoom(); return; }
  if (p.grabCD > 0) p.grabCD--;
  if (p.pawT > 0) p.pawT--;
  if (p.meowT > 0) p.meowT--;

  }
}

function update(){
  frame++;
  for (const g of ['X','Y','K']) gateAnim[g] += ((gateOpen[g] ? 1 : 0) - gateAnim[g]) * 0.2;
  if (fadeT > 0) fadeT--;
  if (thoughts.length && state !== 'title' && state !== 'win') {
    const th = thoughts[0];
    if (++th.t > th.dur) thoughts.shift();
  }

  if (state === 'title') {
    if (pressed.has('jump') || pressed.has('paw')) newGame();
  } else if (state === 'play') {
    updateBird();
    updatePlay();
  } else if (state === 'dead') {
    if (--deadT <= 0) {
      const e = cur.entry;
      Object.assign(player, { x:e.x, y:e.y, facing:e.facing, vx:0, vy:0, state:'normal', dbl:false });
      fadeT = 16; state = 'play';
    }
  } else if (state === 'exit') {
    if (--exitT <= 0) { state = 'win'; winT = 0; winCatY = roofYAt(158, 0) - 9; SFX.win(); }
  } else if (state === 'win') {
    winT++;
    if (winT > 60 && (pressed.has('jump') || pressed.has('paw'))) state = 'title';
  }

  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.08; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  pressed.clear();
}

}

function drawDepth(){

  const pal = cur.def.pal;
  for (let ty = 0; ty < grid.length; ty++)
    for (let tx = 0; tx < grid[0].length; tx++) {

    const step = h.state === 'walk' || h.state === 'back' ? ((frame >> 3) % 2) : 0;
    const face = h.state === 'back' ? -1 : 1;
    r(jeans, -3, 158, 3, 15 - step); r(jeans, 1, 158, 3, 14 + step);  // legs
    r(shoe, -4, 173 - step, 4, 3); r(shoe, 1, 172 + step, 4, 3);
    r(top, -4, 138, 9, 21);
    r(skin, -3, 128, 7, 9);
    r(hair, -3, 127, 8, 3); r(hair, face > 0 ? -3 : 3, 128, 2, 6);
    r('#20121e', face > 0 ? 2 : -2, 131, 1, 1);
    if (h.state === 'open') {
      const reach = Math.min(1, h.t / 20);
      for (let i = 0; i < 12; i++) r(top, 3 + Math.round(i * 0.8 * reach), 139 - Math.round(i * 1.4 * reach), 2, 2);
      r(skin, 3 + Math.round(10 * reach), 136 - Math.round(17 * reach), 3, 3);
    } else r(top, face > 0 ? 3 : -5, 140 + step, 3, 10);
  }
}

function drawLevel(){
  const pal = cur.def.pal;
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = pal.stripe;
  for (let x = 6; x < W; x += 12) ctx.fillRect(x, 0, 2, H);
  for (let y = 10; y < H; y += 24) for (let x = 0; x < W; x += 12) ctx.fillRect(x + ((y/24|0)%2)*6, y, 1, 1);

  drawDepth();
  for (let ty = 0; ty < grid.length; ty++)
    for (let tx = 0; tx < grid[0].length; tx++) {
      const c = grid[ty][tx];
      if (c === '#') drawSolid(tx, ty);
      else if (SOLID.has(c)) drawFurniture(c, tx, ty);
      else if (c === '=') drawShelf(tx*T, ty*T);
      else if (c === 't') drawTable(tx, ty);
    }
  for (let ty = 0; ty < grid.length; ty++)
    for (let tx = 0; tx < grid[0].length; tx++) {
      const c = grid[ty][tx];
      if (c >= '1' && c <= '9') drawDoor(tx*T, ty*T);
      else if (c === 'W') drawStudyWindow(tx*T, ty*T);
      else if (c === 'w') drawBedroomWindow(tx*T, ty*T);
      else if (c === 'M') drawFeeder(tx, ty);
      else if (isGate(c)) drawGate(tx, ty, c);
    }
  levers.forEach(drawLever);
  drawHazards();
  ctx.save(); ctx.translate(1, -2);
  plates.forEach(drawPlate);
  for (const f of fishes) if (!f.got) drawSprite(FISH, FISH_PAL, f.x, f.y + Math.round(Math.sin(frame/12 + f.x) * 1.5), false);
  for (const it of cur.items) if (!it.got) {
    ctx.fillStyle = `rgba(157,255,176,${0.15 + 0.1*Math.sin(frame/10)})`; ctx.fillRect(it.x - 3, it.y - 3, 12, 13);
    drawSprite(CATNIP, CATNIP_PAL, it.x, it.y);
  }
  for (const o of objs) o.type === 'box' ? drawBox(o) : drawSprite(VASE, VASE_PAL, o.x, o.y);
  for (const k of kibbles) { ctx.fillStyle = '#8f5a2a'; ctx.fillRect(Math.round(k.x), Math.round(k.y), 3, 3); ctx.fillStyle = '#c08a4a'; ctx.fillRect(Math.round(k.x), Math.round(k.y), 2, 1); }
  roombas.forEach(drawRoomba);
  if (cur.human) drawHuman(cur.human);
  drawCat();
  drawWater();
  ctx.restore();
  // doorway prompt
  const p = player;
  if (state === 'play' && p.ground && p.state === 'normal' && doorAt(p) && (frame >> 4) & 1) {
    const ax = Math.round(p.x + p.w/2), ay = Math.round(p.y - 8);
    ctx.fillStyle = '#ffd35a';
    ctx.fillRect(ax, ay, 1, 1); ctx.fillRect(ax-1, ay+1, 3, 1); ctx.fillRect(ax-2, ay+2, 5, 1);
  }
  for (const pt of particles) { ctx.fillStyle = pt.col; ctx.fillRect(Math.round(pt.x), Math.round(pt.y), 1, 1); }
}

function drawMinimap(x0, y0){
  for (const id of ROOM_IDS) {
    const d = ROOMS[id], x = x0 + d.gx * 9, y = y0 + d.gy * 6;
    ctx.fillStyle = id === cur.id ? '#f0a040' : (world[id].visited ? '#6a5a8a' : '#2a2238');
    ctx.fillRect(x, y, 8, 5);
  }
}
function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, 13);
  text(cur.def.name, 4, 10, '#f1e7da');
  if (hasZoomies) drawSprite(CATNIP, CATNIP_PAL, 138, 3);
  drawMinimap(152, 1);
  drawSprite(FISH, FISH_PAL, 216, 4);
  text(`${fishGot}/${fishTotal}`, 228, 10, '#8fd3ff');
  drawHeart(284, 3, '#ff6b8a');
  text(`${Math.max(0, 9 - deaths)}`, 294, 10, '#ff9fb2');
}
function wrapPx(str, maxW){
  const words = str.split(' '), lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (dctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function drawThought(){
  const th = thoughts[0];
  if (!th || state === 'title' || state === 'win') return;
  const a = Math.max(0, Math.min(1, th.t / 8, (th.dur - th.t) / 20));
  const fs = Math.round(10.5 * S);
  dctx.font = `${fs}px VT323, monospace`;
  dctx.textAlign = 'left'; dctx.textBaseline = 'alphabetic';
  const lines = wrapPx(th.text, 230 * S);
  const pad = 5 * S, lh = fs * 0.95;
  const w = Math.max(...lines.map(l => dctx.measureText(l).width)) + pad * 2;
  const h = lines.length * lh + pad * 1.3;
  // Lyra's head, in screen pixels (entities are drawn 2px up for the depth effect)
  const hx = (player.x + player.w / 2 + 1 + player.facing * 3) * S, hy = (player.y - 3) * S;
  // bubble goes at the top, unless Lyra is up there, then at the bottom
  let y = Math.round(16 * S);
  const below = hy < y + h + 26 * S;
  if (below) y = Math.round(cvs.height - h - 6 * S);
  const x = Math.round(Math.max(4 * S, Math.min(cvs.width - w - 4 * S, hx - w * 0.35)));
  dctx.globalAlpha = a;
  dctx.fillStyle = 'rgba(255,248,238,.96)';
  dctx.strokeStyle = '#2b2238'; dctx.lineWidth = Math.max(1, S * 0.75);
  // trail of shrinking bubbles from the cloud down (or up) to Lyra's head
  const sx = Math.max(x + 12 * S, Math.min(x + w - 12 * S, hx));
  const sy = below ? y : y + h;
  const ex = hx, ey = below ? hy + 14 * S : hy - 3 * S;
  const dist = Math.hypot(ex - sx, ey - sy);
  const n = Math.max(3, Math.min(6, Math.round(dist / (11 * S))));
  for (let i = 1; i <= n; i++) {
    const k = i / (n + 0.6);
    const r = (3.4 - 2.4 * (i - 1) / Math.max(1, n - 1)) * S;
    dctx.beginPath(); dctx.arc(sx + (ex - sx) * k, sy + (ey - sy) * k, r, 0, Math.PI * 2);
    dctx.fill(); dctx.stroke();
  }
  // cloud-ish bubble: rounded box with a few puffs along the edges
  dctx.beginPath();
  if (dctx.roundRect) dctx.roundRect(x, y, w, h, 7 * S); else dctx.rect(x, y, w, h);
  dctx.fill(); dctx.stroke();
  dctx.fillStyle = '#2b2238';
  lines.forEach((ln, i) => dctx.fillText(ln, x + pad, y + pad * 0.6 + (i + 0.85) * lh));
  dctx.globalAlpha = 1;
}

function drawTitle(){
  ctx.fillStyle = '#231a38'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#2a2042'; for (let x = 6; x < W; x += 12) ctx.fillRect(x, 0, 2, H);
  ctx.fillStyle = '#48301f'; ctx.fillRect(0, 160, W, 32);
  ctx.fillStyle = '#6b4a3a'; ctx.fillRect(0, 160, W, 3);
  const wx = 214, wy = 44;
  ctx.fillStyle = 'rgba(190,210,255,0.06)';
  ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx+72, wy+84); ctx.lineTo(wx-40, 160); ctx.lineTo(wx-140, 160); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e9dfcc'; ctx.fillRect(wx, wy, 72, 84);
  ['#0d1638','#16224a','#1f2e5e','#2a3c72'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(wx+4, wy+4 + i*19, 64, 20); });
  ctx.fillStyle = '#fff4c8'; ctx.fillRect(wx+42, wy+12, 14, 14);
  ctx.fillStyle = '#0d1638'; ctx.fillRect(wx+49, wy+10, 9, 9);
  ctx.fillStyle = '#e9dfcc'; ctx.fillRect(wx, wy+40, 72, 4); ctx.fillRect(wx+34, wy+44, 4, 40);
  ctx.fillStyle = '#b0413e'; ctx.fillRect(wx-10, wy-6, 10, 94); ctx.fillRect(wx+72, wy-6, 10, 94);
  ctx.fillStyle = '#5a3a2a'; ctx.fillRect(wx-14, wy-8, 100, 3);
  ctx.fillStyle = '#6b4a3a'; ctx.fillRect(wx-6, wy+84, 84, 5);
  drawSprite(CAT.idle, CAT_PAL, 120, 133, false, 3, (frame % 200) < 6 ? { k:'o' } : null);
  text('CATSCAPE', 20, 44, '#f0a040', 'left', 16);
  text('Lyra wants that bird.', 20, 66, '#f1e7da');
  text('One whole house.', 20, 80, '#f1e7da');
  text('One hooman in the way.', 20, 94, '#f1e7da');
  if ((frame >> 5) & 1) text('Press JUMP to start', 20, 182, '#8fd3ff');
}

function drawWin(){
  drawNightSky();
  const off = winT * 0.4;
  drawRooftops(off);
  // Lyra trots along the rooftops (the roofs scroll under her), hopping between heights
  const target = roofYAt(158, off) - 9;
  winCatY += (target - winCatY) * (target < winCatY ? 0.35 : 0.5);
  const bob = Math.abs(winCatY - target) < 1 ? -Math.round(Math.abs(Math.sin(winT / 6))) : 0;
  drawSprite((winT >> 3) % 2 ? CAT.run1 : CAT.run2, CAT_PAL, 150, Math.round(winCatY) + bob, false, 1);
  drawSprite((winT >> 2) & 1 ? BIRD2 : BIRD3, BIRD_PAL, 206 + Math.sin(winT/20)*10, 100 + Math.sin(winT/9)*4);
  panel(14, 16, W - 28, 88);
  text('Freedom!', W/2, 40, '#f0a040', 'center', 16);
  text('Lyra iz out.', W/2, 58, '#f1e7da', 'center');
  text('Da birb iz nervous.', W/2, 70, '#f1e7da', 'center');
  text(`Fish: ${fishGot}/${fishTotal}`, W/2, 86, '#8fd3ff', 'center');
  text(`Lives left: ${Math.max(0, 9 - deaths)}/9`, W/2, 98, '#ff9fb2', 'center');
  if (winT > 60 && (frame >> 5) & 1) text('Press JUMP to play again', W/2, 186, '#f1e7da', 'center');
}

function render(){
  textQ.length = 0;
  if (state === 'title') drawTitle();
  else if (state === 'win') drawWin();
  else {
    drawLevel();
    drawHUD();
    if (state === 'dead') {
      ctx.fillStyle = `rgba(20,0,10,${0.5 * (1 - deadT / 80)})`; ctx.fillRect(0, 0, W, H);
      text(deathMsg, W/2, 100, '#ff6b6b', 'center', 16);
    }
  }
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(lo, 0, 0, cvs.width, cvs.height);
  flushText();
  drawThought();
  let fade = 0;
  if (state !== 'title' && state !== 'win') {
    if (fadeT > 0) fade = Math.min(1, fadeT / 16);
    if (state === 'exit') fade = 1 - exitT / 45;
  }
  if (fade > 0) { dctx.fillStyle = `rgba(0,0,0,${fade})`; dctx.fillRect(0, 0, cvs.width, cvs.height); }
}
/* ---------- Layout & loop ---------- */
const stage = document.getElementById('stage');
function fit(){
  const aw = stage.clientWidth - 8, ah = stage.clientHeight - 8;
  let sc = Math.min(aw / W, ah / H);
  if (sc >= 2) sc = Math.floor(sc);
  sc = Math.max(sc, 0.5);
  const cw = Math.floor(W * sc), ch = Math.floor(H * sc);
  cvs.style.width = cw + 'px';
  cvs.style.height = ch + 'px';
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  S = cvs.width / W;
}
const fullBtn = document.getElementById('btnFull');
const appEl = document.getElementById('app');
if (document.fullscreenEnabled && appEl.requestFullscreen) {
  fullBtn.hidden = false;
  fullBtn.addEventListener('click', e => {
    e.currentTarget.blur();
    if (document.fullscreenElement) document.exitFullscreen(); else appEl.requestFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => { fullBtn.textContent = document.fullscreenElement ? 'Exit full' : 'Full screen'; setTimeout(fit, 50); });
}
new ResizeObserver(fit).observe(stage);
addEventListener('resize', fit);
fit();

let acc = 0, last = performance.now();
const STEP = 1000 / 60;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
// Test hook: only active when a test harness sets globalThis.__CATSCAPE_TEST__ before loading.
if (globalThis.__CATSCAPE_TEST__) {
  Object.defineProperties(globalThis.__CATSCAPE_TEST__, Object.getOwnPropertyDescriptors({
    update, render, press, release, newGame, enterRoom, ROOM_IDS,
    get state(){ return state; }, get player(){ return player; }, get cur(){ return cur; },
    get objs(){ return objs; }, get gateOpen(){ return gateOpen; }, get thoughts(){ return thoughts; },
    get deaths(){ return deaths; }, get story(){ return { heatingOn, valveOpen, heat, windowOpen, netHits, netDown, human: cur && cur.human && cur.human.state }; },
    cheat: { zoomies(){ hasZoomies = true; }, gate(g, v){ gateOpen[g] = v; }, heating(v){ heatingOn = v; } },
  }));
  return;
}
const start = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) {
  Promise.race([Promise.all([document.fonts.load('8px "Press Start 2P"'), document.fonts.load('10px VT323')]), new Promise(r => setTimeout(r, 1500))]).then(start, start);
} else start();
})();
</script>
